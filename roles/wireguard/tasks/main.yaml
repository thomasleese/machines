---
- name: Install Speedtest
  ansible.builtin.apt:
    pkg: speedtest-cli

- name: Install WireGuard
  ansible.builtin.apt:
    pkg:
      - wireguard
      - wireguard-tools

- name: Install qrencode
  ansible.builtin.apt:
    pkg: qrencode

- name: Enable IP forwarding
  ansible.builtin.copy:
    src: 20-ip-forwarding.conf
    dest: /etc/sysctl.d/20-ip-forwarding.conf
    owner: root
    group: root
    mode: "0644"

- name: Copy server configuration
  ansible.builtin.template:
    src: wg0.conf
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0640"

- name: Copy iPhone (all) configuration
  ansible.builtin.template:
    src: iphone-all.conf
    dest: /etc/wireguard/iphone-all.conf
    owner: root
    group: root
    mode: "0644"

- name: Copy iPhone (DNS) configuration
  ansible.builtin.template:
    src: iphone-dns.conf
    dest: /etc/wireguard/iphone-dns.conf
    owner: root
    group: root
    mode: "0644"

- name: Copy MacBook (all) configuration
  ansible.builtin.template:
    src: macbook-all.conf
    dest: /etc/wireguard/macbook-all.conf
    owner: root
    group: root
    mode: "0644"

- name: Copy MacBook (DNS) configuration
  ansible.builtin.template:
    src: macbook-dns.conf
    dest: /etc/wireguard/macbook-dns.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable and start service
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    state: started
    enabled: true
